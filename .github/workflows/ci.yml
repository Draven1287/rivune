name: Apple client CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test source exporter
        run: python3 scripts/test_source_export.py
      - name: Build macOS client
        run: >-
          xcodebuild -project Rivune.xcodeproj -scheme "Rivune Mac"
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS client
        run: >-
          xcodebuild -project Rivune.xcodeproj -scheme "Rivune Mac"
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Build iOS client
        run: >-
          xcodebuild -project Rivune.xcodeproj -scheme "Rivune iOS"
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
