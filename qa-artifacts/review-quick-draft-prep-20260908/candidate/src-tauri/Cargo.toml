[package]
name = "rivune-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rivune"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rivune-legacy-import-preview = { path = "../../../tauri-migration-audit-20260907/import-preview" }
rivune-legacy-import-archive = { path = "../../../tauri-migration-audit-20260907/import-archive" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["AppKitDefines", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObjCRuntime", "NSObject", "NSString", "NSURL"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
